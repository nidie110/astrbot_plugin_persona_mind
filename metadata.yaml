name: astrbot_plugin_persona_mind
display_name: 人格认知引擎
desc: 给她一份「当下的人格」：先判断这句话意味着什么，再更新双层 PAD 情绪与关系势场，用八动作 × 七口吻决定怎么回，并带上本地知识、语料与日记；不接管主模型输出，失败自动降级。
version: 1.2.1
author: nidie110
repo: https://github.com/nidie110/astrbot_plugin_persona_mind
astrbot_version: ">=4.11.0"
tags:
  - 人格
  - 情绪
  - 记忆
  - 提示词
help: |
  装完先发 /mind selftest 自检。
  /mind status 看她此刻的情绪与关系值
  /mind profile 看她对你的侧写
  /mind why 看当前会话上一轮的决策诊断
  /mind kb 关键词 检索知识库
  /mind toggle 一键开关（对比用）
  /mind diary [今天|昨天|YYYY-MM-DD] 手动写/补写日记
  日记默认每天 22:40 自动写（diary_at 可改），当天没素材就跳过
