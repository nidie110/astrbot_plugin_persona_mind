name: astrbot_plugin_persona_mind
display_name: 人格认知引擎
desc: 先想再说：给她一套可观测的内心（人格/情绪/推断/意图），让她开口前先有自己的立场。大五人格 + OCC 情绪评价 + PAD 衰减 + ToM 情景推断 + 五意图计算 + 人物侧写 + 本地知识库/语料库，让她开口前先有自己的立场和情绪。
version: 1.0.0
author: 你的名字
repo: https://github.com/你的用户名/astrbot_plugin_persona_mind
astrbot_version: ">=4.11.0"
tags:
  - 人格
  - 情绪
  - 记忆
  - 提示词
help: |
  装完先发 /mind selftest 自检。
  /mind status 看她此刻的情绪与关系值
  /mind profile 看她对你的侧写
  /mind kb 查知识库命中
  /mind toggle 一键开关（对比用）
